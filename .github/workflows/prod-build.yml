name: Production Build

on:
  workflow_call:
    inputs:
      version:
        description: 'Version to build'
        required: true
        type: string
      tag_name:
        description: 'GitHub release tag'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build'
        required: true
        type: string
      tag_name:
        description: 'GitHub release tag'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-production-packages:
    name: Packages
    runs-on: self-hosted
    steps:
      # Debian Build Steps
      - name: Checkout for Debian build
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch STARTcloud UI artifact
        run: |
          UI_VERSION=$(node -p "require('./package.json').startcloudUiVersion")
          echo "Fetching STARTcloud UI v${UI_VERSION}"
          mkdir -p ui
          curl -fsSL "https://github.com/STARTcloud/startcloud-ui/releases/download/v${UI_VERSION}/startcloud-ui-${UI_VERSION}.tar.gz" | tar -xz -C ui

      - name: Generate OpenAPI documentation
        run: npm run generate-docs

      - name: Remove dev dependencies for packaging
        run: rm -rf node_modules && npm ci --omit=dev

      - name: Set Debian package variables
        run: |
          echo "VERSION=${{ inputs.version }}" >> $GITHUB_ENV
          echo "PACKAGE_NAME=hyperweaver-server" >> $GITHUB_ENV
          echo "ARCH=amd64" >> $GITHUB_ENV
          echo "TAG_NAME=${{ inputs.tag_name }}" >> $GITHUB_ENV

      - name: Create Debian package structure
        run: |
          mkdir -p "${PACKAGE_NAME}_${VERSION}_${ARCH}"/{opt/hyperweaver-server/config-templates,opt/hyperweaver-server/scripts,etc/hyperweaver-server,etc/systemd/system,var/lib/hyperweaver-server,var/log/hyperweaver-server,DEBIAN}

      - name: Copy application files to Debian package
        run: |
          cp -r controllers models routes auth config middleware rules utils scripts index.js package.json ui "${PACKAGE_NAME}_${VERSION}_${ARCH}/opt/hyperweaver-server/"
          cp -r node_modules "${PACKAGE_NAME}_${VERSION}_${ARCH}/opt/hyperweaver-server/"

      - name: Copy configuration files to Debian package
        run: |
          # Config templates
          cp packaging/config/*.yaml "${PACKAGE_NAME}_${VERSION}_${ARCH}/opt/hyperweaver-server/config-templates/"

          # Scripts
          cp packaging/scripts/certbot-deploy-hook.sh "${PACKAGE_NAME}_${VERSION}_${ARCH}/opt/hyperweaver-server/scripts/"

          # Systemd service
          cp packaging/DEBIAN/systemd/hyperweaver-server.service "${PACKAGE_NAME}_${VERSION}_${ARCH}/etc/systemd/system/"
          cp packaging/DEBIAN/systemd/hyperweaver-server-update.path "${PACKAGE_NAME}_${VERSION}_${ARCH}/etc/systemd/system/"
          cp packaging/DEBIAN/systemd/hyperweaver-server-update.service "${PACKAGE_NAME}_${VERSION}_${ARCH}/etc/systemd/system/"

          # DEBIAN control scripts
          cp packaging/DEBIAN/{preinst,postinst,prerm,postrm} "${PACKAGE_NAME}_${VERSION}_${ARCH}/DEBIAN/"

      - name: Create Debian control file
        run: |
          cat > "${PACKAGE_NAME}_${VERSION}_${ARCH}/DEBIAN/control" << EOF
          Package: hyperweaver-server
          Version: ${VERSION}
          Section: web
          Priority: optional
          Architecture: ${ARCH}
          Maintainer: Makr91 <makr91@users.noreply.github.com>
          Depends: nodejs (>= 22.0.0), sqlite3, openssl
          Description: Hyperweaver Server - hypervisor control-plane web interface
           Serves the STARTcloud UI, authenticates users and aggregates the
           Hyperweaver and Zoneweaver agents from one pane.
          Homepage: https://github.com/Makr91/hyperweaver-server
          EOF

      - name: Set Debian package permissions
        run: |
          find "${PACKAGE_NAME}_${VERSION}_${ARCH}" -type d -exec chmod 755 {} \;
          find "${PACKAGE_NAME}_${VERSION}_${ARCH}" -type f -exec chmod 644 {} \;
          chmod 755 "${PACKAGE_NAME}_${VERSION}_${ARCH}/DEBIAN"/{preinst,postinst,prerm,postrm}
          chmod 755 "${PACKAGE_NAME}_${VERSION}_${ARCH}/opt/hyperweaver-server/scripts"/*

      - name: Build Debian package
        run: |
          dpkg-deb --build "${PACKAGE_NAME}_${VERSION}_${ARCH}" "${PACKAGE_NAME}_${VERSION}_${ARCH}.deb"

      #      # OmniOS Build Steps
      #      - name: Fresh checkout for OmniOS build
      #        uses: actions/checkout@v7
      #        with:
      #          path: omnios-source
      #          clean: true
      #
      #      - name: Clean OmniOS build directory
      #        run: |
      #          ssh ghrunner@omnios.packages.startcloud.com "rm -rf /local/builds/hyperweaver-server/* /local/builds/hyperweaver-server/.*" || true
      #
      #      - name: Sync source code to OmniOS
      #        run: |
      #          rsync -av --delete \
      #            --exclude='.git' \
      #            --exclude='node_modules' \
      #            --exclude='frontend/node_modules' \
      #            --exclude='frontend/dist' \
      #            --exclude='*.deb' \
      #            omnios-source/ ghrunner@omnios.packages.startcloud.com:/local/builds/hyperweaver-server/
      #
      #      - name: Build package on OmniOS
      #        run: |
      #          ssh ghrunner@omnios.packages.startcloud.com "
      #            cd /local/builds/hyperweaver-server &&
      #            export PATH=/opt/ooce/bin:/opt/ooce/node-22/bin:\$PATH &&
      #            export MAKE=gmake &&
      #            chmod +x packaging/omnios/build.sh &&
      #            ./packaging/omnios/build.sh
      #          "
      #
      #      - name: Transfer OmniOS package back
      #        run: |
      #          rsync -av ghrunner@omnios.packages.startcloud.com:/local/builds/hyperweaver-server/*.p5p ./ || echo "No .p5p files found"
      #
      - name: Install GitHub CLI
        run: |
          if ! command -v gh &> /dev/null; then
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt update
            sudo apt install gh -y
          fi

      - name: Upload Debian package to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.event.inputs.tag_name || env.TAG_NAME }} "${PACKAGE_NAME}_${VERSION}_${ARCH}.deb" --clobber

      - name: Generate and upload SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha256sum "${PACKAGE_NAME}_${VERSION}_${ARCH}.deb" > SHA256SUMS.txt
          gh release upload "${{ github.event.inputs.tag_name || env.TAG_NAME }}" SHA256SUMS.txt --clobber

      - name: Generate and upload update-info.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag_name || env.TAG_NAME }}"
          DL="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          NOTES="$(gh release view "${TAG}" --json body --jq .body | jq -Rs .)"
          cat > update-info.json << EOF
          {
            "version": "${VERSION}",
            "releaseUrl": "https://github.com/${{ github.repository }}/releases/tag/${TAG}",
            "releaseDate": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "changelog": "https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md",
            "releaseNotes": ${NOTES},
            "linuxUrl": "${DL}/${PACKAGE_NAME}_${VERSION}_${ARCH}.deb",
            "checksumsUrl": "${DL}/SHA256SUMS.txt"
          }
          EOF
          gh release upload "${TAG}" update-info.json --clobber

      #      - name: Upload OmniOS package to release
      #        env:
      #          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #        run: |
      #          for file in *.p5p; do
      #            if [ -f "$file" ]; then
      #              echo "Uploading $file..."
      #              gh release upload ${{ github.event.inputs.tag_name || env.TAG_NAME }} "$file" --clobber
      #            fi
      #          done
      #
      #      - name: Publish OmniOS package to repository
      #        run: |
      #          ssh ghrunner@omnios.packages.startcloud.com "
      #            cd /local/builds/hyperweaver-server &&
      #            pfexec pkgsend publish -d proto -s file:///local/public/r151054/pkg hyperweaver-server.p5m.final &&
      #            pfexec pkgrepo refresh -s /local/public/r151054/pkg &&
      #            pfexec svcadm restart pkg/server:r151054_STARTcloud
      #          "
      #
      #      - name: Clean up OmniOS build directory
      #        run: |
      #          ssh ghrunner@omnios.packages.startcloud.com "rm -rf /local/builds/hyperweaver-server/*"
      #
      - name: Upload Debian package to repository server
        run: |
          rsync -av hyperweaver-server_*.deb startcloud@debian.startcloud.com:/tmp/

      - name: Add package to repository pool
        run: |
          ssh startcloud@debian.startcloud.com "
            mkdir -p /local/public/debian/pool/main/h/hyperweaver-server
            cp /tmp/hyperweaver-server_*.deb /local/public/debian/pool/main/h/hyperweaver-server/
          "

      - name: Create multi-suite directory structure
        run: |
          ssh startcloud@debian.startcloud.com "
            cd /local/public/debian
            # Create suite directories if they don't exist
            mkdir -p dists/bookworm/main/binary-amd64
            mkdir -p dists/trixie/main/binary-amd64
          "

      - name: Update repository Packages files for all suites
        run: |
          ssh startcloud@debian.startcloud.com "
            cd /local/public/debian
            # Generate Packages files for each suite
            for suite in bookworm trixie; do
              dpkg-scanpackages --arch amd64 pool/ > dists/\$suite/main/binary-amd64/Packages
              gzip -c dists/\$suite/main/binary-amd64/Packages > dists/\$suite/main/binary-amd64/Packages.gz
            done
          "

      - name: Generate Release files for all suites
        run: |
          ssh startcloud@debian.startcloud.com "
            cd /local/public/debian
            # Generate Release files for each suite
            for suite in bookworm trixie; do
              cd dists/\$suite
              /local/generate-release.sh \$suite > Release
              cd ../..
            done
          "

      - name: Create stable distribution with proper Release file
        run: |
          ssh startcloud@debian.startcloud.com "
            cd /local/public/debian/dists
            rm -rf stable 2>/dev/null || true
            cp -r trixie stable
            cd stable
            /local/generate-release.sh stable > Release
          "

      - name: Sign repository for all suites including stable
        run: |
          ssh startcloud@debian.startcloud.com "
            cd /local/public/debian
            # Sign each suite including stable
            for suite in bookworm trixie stable; do
              cd dists/\$suite
              export GNUPGHOME=\$(mktemp -d /local/pgp/pgpkeys-XXXXXX)
              cat /local/pgp/pgp-key.private | gpg --import
              cat Release | gpg --default-key startcloud -abs > Release.gpg
              cat Release | gpg --default-key startcloud -abs --clearsign > InRelease
              rm -rf \$GNUPGHOME
              cd ../..
            done
          "

      - name: Cleanup temporary files
        run: |
          ssh startcloud@debian.startcloud.com "rm -f /tmp/hyperweaver-server_*.deb"
